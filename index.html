<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>JPTTV Account Log & Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --border: #334155; --success: #22c55e; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 2rem 1rem; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.8rem; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.3rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
        .card h3 { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; margin-bottom: 1rem; }
        .row { display: flex; justify-content: space-between; align-items: center; background: rgba(15,23,42,0.6); padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 0.5rem; border: 1px solid var(--border); font-size: 0.85rem; }
        .val-group { display: flex; align-items: center; gap: 0.5rem; }
        .val { font-weight: 700; color: var(--accent); word-break: break-all; }
        .btn-copy { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid var(--accent); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-copy:hover { background: var(--accent); color: var(--bg); }
        .btn-copy.copied { background: var(--success); color: #fff; border-color: var(--success); }
        .timer { display: flex; justify-content: space-around; text-align: center; padding-top: 0.5rem; }
        .time-box .num { font-size: 1.6rem; font-weight: 700; }
        .time-box .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
        .sep { font-size: 1.5rem; font-weight: 700; color: var(--muted); }
        .table-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
        .active { background: rgba(34,197,94,0.15); color: var(--success); }
        .expired { background: rgba(239,68,68,0.15); color: var(--danger); }
        .msg { text-align: center; color: var(--muted); padding: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>JPTTV Account Status & Logs</h1>
            <p>Real-time Credentials, Expiration Countdown & Account History</p>
        </header>

        <div class="grid">
            <div class="card">
                <h3>Akun Terbaru</h3>
                <div id="latest-creds"><div class="msg">Memuat data...</div></div>
            </div>
            <div class="card">
                <h3>Masa Expired (Countdown)</h3>
                <div id="timer-box" class="timer"><div class="msg">Menghitung...</div></div>
            </div>
        </div>

        <div class="table-box">
            <h2 style="font-size:1.1rem; margin-bottom:1rem;">Log Semua Akun</h2>
            <table>
                <thead>
                    <tr><th>No</th><th>Username</th><th>Password</th><th>Dibuat</th><th>Expired</th><th>Status</th></tr>
                </thead>
                <tbody id="log-body">
                    <tr><td colspan="6" class="msg">Memuat log...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SERVER_XC = "http://184.174.96.206:8080";
        let targetExpiry = null;
        let timerInterval = null;

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('copied');
                }, 1500);
            }).catch(err => console.error('Gagal copy:', err));
        }

        async function init() {
            try {
                const res = await fetch('accounts.json?t=' + Date.now());
                if (!res.ok) throw new Error('Gagal memuat accounts.json');
                const data = await res.json();

                if (data && data.length > 0) {
                    // Mengambil data paling atas (index 0)
                    const latest = data[0];

                    document.getElementById('latest-creds').innerHTML = `
                        <div class="row">
                            <span>Server XC</span>
                            <div class="val-group">
                                <span class="val">${SERVER_XC}</span>
                                <button onclick="copyText('${SERVER_XC}', this)" class="btn-copy">Copy</button>
                            </div>
                        </div>
                        <div class="row">
                            <span>Username</span>
                            <div class="val-group">
                                <span class="val">${latest.username}</span>
                                <button onclick="copyText('${latest.username}', this)" class="btn-copy">Copy</button>
                            </div>
                        </div>
                        <div class="row">
                            <span>Password</span>
                            <div class="val-group">
                                <span class="val">${latest.password}</span>
                                <button onclick="copyText('${latest.password}', this)" class="btn-copy">Copy</button>
                            </div>
                        </div>
                    `;
                    
                    document.getElementById('log-body').innerHTML = data.map((item, i) => `
                        <tr>
                            <td>${i + 1}</td>
                            <td><strong>${item.username}</strong></td>
                            <td>${item.password}</td>
                            <td>${item.created_at || '-'}</td>
                            <td>${item.exp_date || '-'}</td>
                            <td><span class="badge ${item.status?.toLowerCase() === 'active' ? 'active' : 'expired'}">${item.status || 'Unknown'}</span></td>
                        </tr>
                    `).join('');

                    if (latest.exp_date_iso) {
                        targetExpiry = new Date(latest.exp_date_iso).getTime();
                        startTimer();
                    } else {
                        document.getElementById('timer-box').innerHTML = '<div class="msg">Unlimited / Tidak Ada Data Expired</div>';
                    }
                } else {
                    document.getElementById('latest-creds').innerHTML = '<div class="msg">Tidak ada akun</div>';
                    document.getElementById('timer-box').innerHTML = '<div class="msg">-</div>';
                    document.getElementById('log-body').innerHTML = '<tr><td colspan="6" class="msg">Belum ada akun.</td></tr>';
                }
            } catch (err) {
                document.getElementById('latest-creds').innerHTML = '<div class="msg">Gagal memuat data</div>';
                document.getElementById('timer-box').innerHTML = '<div class="msg">-</div>';
                document.getElementById('log-body').innerHTML = `<tr><td colspan="6" class="msg">${err.message}</td></tr>`;
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            function update() {
                const diff = targetExpiry - Date.now();
                const container = document.getElementById('timer-box');
                if (diff < 0) {
                    container.innerHTML = '<div class="msg" style="color:var(--danger)">Masa Expired Telah Habis</div>';
                    clearInterval(timerInterval);
                    return;
                }
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                container.innerHTML = `
                    <div class="time-box"><div class="num">${String(d).padStart(2,'0')}</div><div class="lbl">Hari</div></div><div class="sep">:</div>
                    <div class="time-box"><div class="num">${String(h).padStart(2,'0')}</div><div class="lbl">Jam</div></div><div class="sep">:</div>
                    <div class="time-box"><div class="num">${String(m).padStart(2,'0')}</div><div class="lbl">Menit</div></div><div class="sep">:</div>
                    <div class="time-box"><div class="num">${String(s).padStart(2,'0')}</div><div class="lbl">Detik</div></div>
                `;
            }
            update();
            timerInterval = setInterval(update, 1000);
        }

        init();
    </script>
</body>
</html>
